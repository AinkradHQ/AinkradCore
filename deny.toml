# Supply-chain gate (E1-01.3): `make audit`. Exceptions are listed with a reason, never silently allowed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # E2-19 (iroh): "unmaintained", a compile-time macro crate reached through netlink-packet-core (netwatch, the
  # Linux/Android network-change monitor). No runtime code, no untrusted input. Drop when iroh's netwatch moves off it.
  { id = "RUSTSEC-2024-0436", reason = "paste: macro only, via iroh -> netwatch -> netlink-packet-core" },
]

[licenses]
version = 2
# Our own crates are `publish = false` and carry no licence field.
private = { ignore = true }
# E2-19 (iroh): Unlicense (public-domain dedication) on three crates that exist only in iroh's browser (wasm) build
# path (reqwest -> ws_stream_wasm -> pharos, async_io_stream); they are not compiled for any native target.
exceptions = [
  { name = "ws_stream_wasm", allow = ["Unlicense"] },
  { name = "pharos", allow = ["Unlicense"] },
  { name = "async_io_stream", allow = ["Unlicense"] },
]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `path` dependencies between our private crates are not wildcards.
allow-wildcard-paths = true
# Platform crates must never depend on a module: `crates/server/tests/dependency_direction.rs` (E1-02.6).
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# KAN-253: age with its localisation proc-macros removed (patched in by Cargo.toml [patch.crates-io], pinned by rev).
allow-git = ["https://github.com/AinkradHQ/rage"]
