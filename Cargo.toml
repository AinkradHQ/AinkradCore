[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["modules"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The shipped binaries (E1-15.1, `make release-dry`): one codegen unit and stripped, so the same commit
# built twice is byte-identical. `--release` is unchanged for everything else.
[profile.dist]
inherits = "release"
codegen-units = 1
strip = true

# KAN-253: age without its localisation proc-macros (reproducible builds, no basic-toml / proc-macro-error2).
# Same file format and cryptography as age 0.11.5; the fork changes only the error-message lookup.
[patch.crates-io]
age = { git = "https://github.com/AinkradHQ/rage", rev = "794958a40fd3471e8ea75be0acdf9761191b2a46" }
