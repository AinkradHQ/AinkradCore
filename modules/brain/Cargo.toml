# The Brain module (KAN-476, Phase 1 M1): its own workspace like `modules/citadel` and `modules/toy`,
# `make build-brain` / `make test-brain`. Not part of `make build`/`make test`.
[workspace]
resolver = "3"
members = ["model", "module", "bin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The shipped binary (scripts/release/build.sh): same profile and age fork as the root workspace, so the
# release is reproducible like the other three.
[profile.dist]
inherits = "release"
codegen-units = 1
strip = true

[patch.crates-io]
age = { git = "https://github.com/AinkradHQ/rage", rev = "794958a40fd3471e8ea75be0acdf9761191b2a46" }
