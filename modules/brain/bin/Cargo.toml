[package]
name = "ainkrad-core-brain"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ainkrad-core-server = { path = "../../../crates/server" }
brain-module = { path = "../module" }
leyline-module = { path = "../../leyline/module" }
lore-module = { path = "../../lore/module" }
design-module = { path = "../../design/module" }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
reqwest = { version = "0.12.28", default-features = false }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "process", "net", "time"] }

[features]
# Local semantic help for sorting imported items (see brain-module). On in the shipped build (scripts/release/build.sh); Lore search uses the same model.
semantic = ["brain-module/semantic", "lore-module/semantic"]
