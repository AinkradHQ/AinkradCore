[package]
name = "leyline-module"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ainkrad-core = { path = "../../../crates/core" }
ainkrad-core-server = { path = "../../../crates/server" }
axum = "0.8.9"
base64 = "0.22.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# No `rsa`/`dsa` feature: RUSTSEC-2023-0071 (Marvin) keeps the `rsa` crate out of the tree.
tokio = { version = "1.54.0", features = ["sync"] }
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "ecdsa", "encryption"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
utoipa = "6.0.0"
zeroize = { version = "1.9.1", features = ["serde"] }

[dev-dependencies]
ainkrad-core-server = { path = "../../../crates/server", features = ["test-support"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = "0.3.23"
