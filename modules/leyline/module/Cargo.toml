[package]
name = "leyline-module"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
age = { version = "0.11", default-features = false }
ainkrad-core = { path = "../../../crates/core" }
ainkrad-core-server = { path = "../../../crates/server" }
ainkrad-proto = { path = "../../../crates/proto" }
axum = "0.8.9"
base64 = "0.22.1"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
# No `rsa`/`dsa` feature (the `rsa` crate 0.9 it pulls has RUSTSEC-2023-0071; RSA keys are only parsed here, see
# `rsa_import.rs`) and no `p256`/`p384` (they pull crypto-bigint 0.5, RUSTSEC-2026-0387).
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "ecdsa", "encryption"] }
# PEM RSA keys (E0-9): DER readers only, no RSA arithmetic. Both versions and `pem-rfc7468` were already in the lockfile.
pem-rfc7468 = { version = "0.7.0", features = ["alloc"] }
pkcs1 = { version = "0.7.5", default-features = false }
pkcs8 = { version = "0.10.2", default-features = false }
futures-util = { version = "0.3.34", default-features = false }
tokio = { version = "1.54.0", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
utoipa = "6.0.0"
# Recording blocks (Y3-02) are zstd-compressed before they are age-encrypted: the one new crate (needs `cargo deny check`).
zstd = { version = "0.13.3", default-features = false }
zeroize = { version = "1.9.1", features = ["serde"] }

[dev-dependencies]
ainkrad-core-server = { path = "../../../crates/server", features = ["test-support"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = "0.3.23"

[[bench]]
name = "relay_tap"
harness = false
