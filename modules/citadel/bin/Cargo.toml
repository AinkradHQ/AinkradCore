[package]
name = "ainkrad-core-citadel"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ainkrad-core-server = { path = "../../../crates/server" }
citadel-module = { path = "../module" }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
ainkrad-core-server = { path = "../../../crates/server", features = ["test-support"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "process"] }
