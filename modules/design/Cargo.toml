# The Design module (V1-02): its own workspace like `modules/brain` and `modules/leyline`,
# `make build-design` / `make test-design`. V2-01 added `render`, V2-02 `doc` + `ffi`.
[workspace]
resolver = "3"
members = ["doc", "ffi", "model", "module", "render"]
exclude = ["model/fuzz", "ffi/fuzz", "doc/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
