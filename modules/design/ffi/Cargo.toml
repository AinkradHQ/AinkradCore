# The engine host and its C ABI (V2-02, T4, B1): what the Mac app links as `DesignEngine.xcframework`
# (`make engine`, scripts/design-engine.sh). The only crate with `unsafe`, confined to `src/ffi.rs`.
[package]
name = "design-ffi"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
# The App's build: Skia on Metal. Without it the ABI is the same and `de_attach_metal` returns DE_ERR_GPU.
metal = ["design-render/metal"]

[dependencies]
design-doc = { path = "../doc" }
design-model = { path = "../model" }
design-render = { path = "../render" }
serde_json = "1.0.154"

# tests/metal.rs: a real device, queue and texture through `de_attach_metal` / `de_draw_metal`.
[target.'cfg(target_os = "macos")'.dev-dependencies]
metal = "=0.33.0"
