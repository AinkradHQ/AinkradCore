# R1-03: the parser fuzz target, in its OWN workspace (cargo-fuzz needs nightly; `make build-lore` never touches it).
# Run with `make fuzz-lore` or `cd modules/lore/model/fuzz && cargo +nightly fuzz run parse`.
[package]
name = "lore-model-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lore-model = { path = ".." }

[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
