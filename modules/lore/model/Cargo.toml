# The Lore note model (T5): parses one note's Markdown into what the store and index need. Pure Rust, no I/O, no
# Markdown crate (a hand-rolled line scanner for the small subset, see lib.rs); tests/model.rs checks the dependency list.
[package]
name = "lore-model"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
proptest = "1.7.0"
