[package]
name = "lore-module"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ainkrad-core = { path = "../../../crates/core" }
ainkrad-core-server = { path = "../../../crates/server" }
ainkrad-embed = { path = "../../../crates/embed" }
axum = "0.8.9"
futures-util = "0.3.34"
getrandom = "0.4.3"
lore-model = { path = "../model" }
diffy = "0.4.2"
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
utoipa = "6.0.0"
tokio = { version = "1.54.0", features = ["rt", "time", "process", "io-util", "sync"] }
# Reads uploaded zips (R4-01): central directory only, deflate, nothing written to disk.
zip = { version = "9", default-features = false, features = ["deflate"] }
tracing = "0.1"

[dev-dependencies]
ainkrad-core-server = { path = "../../../crates/server", features = ["test-support"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }

[features]
# Search by meaning: loads the shared local e5 model. Off = search is FTS only and nothing is embedded.
semantic = ["ainkrad-embed/semantic"]
