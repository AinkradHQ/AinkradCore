# The Lore module (R1-03): its own workspace like `modules/design`. `make build-lore` / `make test-lore`.
# Later stories add `module` and `api` here.
[workspace]
resolver = "3"
members = ["model"]
exclude = ["model/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
