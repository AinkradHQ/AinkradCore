# The smallest complete module (E1-20.2): the reference for the module API guide and a fixture
# that drives the Core's real gate. Its own workspace, like `modules/citadel`: `make test-toy`.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "toy-module"
version = "0.1.0"
edition = "2024"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
ainkrad-core = { path = "../../crates/core" }
ainkrad-core-server = { path = "../../crates/server" }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
utoipa = "6.0.0"

[dev-dependencies]
ainkrad-core-server = { path = "../../crates/server", features = ["test-support"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
