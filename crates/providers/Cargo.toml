[package]
name = "ainkrad-providers"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Fake GitHub / GitLab / Linear servers on loopback, for tests only (here and in the server's).
fake = ["dep:axum", "dep:tokio"]

[dependencies]
# HTTPS to the providers' APIs; rustls with ring, like the runner.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.154"
axum = { version = "0.8.9", optional = true }
tokio = { version = "1.54.0", features = ["net", "rt", "sync"], optional = true }

[dev-dependencies]
ainkrad-providers = { path = ".", features = ["fake"] }
tokio = { version = "1.54.0", features = ["macros", "net", "rt-multi-thread"] }
