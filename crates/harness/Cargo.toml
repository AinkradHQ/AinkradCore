[package]
name = "ainkrad-harness"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ainkrad-sys = { path = "../sys" }
getrandom = "0.4.3"
# OpenCode's HTTP API, on loopback only: no TLS.
reqwest = { version = "0.12.28", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["io-util", "process", "rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.0", features = ["macros", "net", "rt-multi-thread"] }
