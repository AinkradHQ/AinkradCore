[package]
name = "ainkrad-ptyhost"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ainkrad-proto = { path = "../proto" }
ainkrad-sys = { path = "../sys" }
base64 = "0.22.1"
# The PTY (decision P2.1): Unix PTYs now, ConPTY for E6.
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
