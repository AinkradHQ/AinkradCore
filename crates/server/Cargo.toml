[package]
name = "ainkrad-core-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "json"] }
ainkrad-core = { path = "../core" }
# Secret shapes for redaction at append (E1-10.2).
ainkrad-proto = { path = "../proto" }
getrandom = "0.4.3"
# APNs (E10.4): the .p8 key's PEM, and HTTP/2 to Apple; ES256 signing with ring, which
# rustls already brings in.
base64 = "0.22.1"
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
# The gateway (E1-06): one hyper accept loop for unix, loopback and TLS; rustls TLS 1.3 only on
# ring; instant-acme for certificates (`Specs/2026-10-29-acme-library-decision.md`), x509-parser
# for a certificate's lifetime.
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "service", "tokio"] }
instant-acme = { version = "=0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tower = { version = "0.5.3", features = ["util"] }
x509-parser = "0.18"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
# The client API's OpenAPI 3.1 contract (E10.1); see `api/v1/spec.rs`.
utoipa = "6.0.0"
schemars = "1"
age = { version = "0.11", default-features = false }
toml = "1"

[features]
# The reference test client (`auth::testing`) and the store's direct enrolment, for this crate's
# integration tests and later lanes' fixtures; never in a release build.
test-support = []

[dev-dependencies]
ainkrad-core-server = { path = ".", features = ["test-support"] }
# The gateway tests (`tests/gateway`): HTTP/1.1 by hand, HTTP/2 through hyper's client, test
# certificates with real validity dates.
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client"] }
time = "0.3"
tokio = { version = "1.54.0", features = ["io-util"] }
futures-util = "0.3.34"
tokio-tungstenite = "0.29.0"
