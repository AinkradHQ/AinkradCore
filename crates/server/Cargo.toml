[package]
name = "ainkrad-core-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
ainkrad-core = { path = "../core" }
getrandom = "0.4.3"
# APNs (E10.4): the .p8 key's PEM, and HTTP/2 to Apple; ES256 signing with ring, which
# rustls already brings in.
base64 = "0.22.1"
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "rustls-tls"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# The client API's OpenAPI 3.1 contract (E10.1); see `api/v1/spec.rs`.
utoipa = "6.0.0"

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.29.0"
# In-process HTTP requests to the router (`oneshot`), for the gate tests.
tower = { version = "0.5.3", features = ["util"] }
