[package]
name = "ainkrad-runner"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# A file an agent publishes by path (E15.12) travels to the server base64-encoded.
base64 = "0.22.1"
ainkrad-harness = { path = "../harness" }
ainkrad-proto = { path = "../proto" }
# Terminals (E2-02, E2-03): the host process and its client.
ainkrad-ptyhost = { path = "../ptyhost" }
futures-util = "0.3.34"
# The connection proof and pairing (E1-11.3): P-256 keys, SHA-256, randomness; already under
# rustls. HTTP to the Core's /handshake and /pair routes.
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "rustls-tls"] }
ring = "0.17.14"
# Only to pick `ring` as rustls's crypto provider for wss://; tokio-tungstenite enables none.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
