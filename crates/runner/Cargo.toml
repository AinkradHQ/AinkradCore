[package]
name = "ainkrad-runner"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Code Mode (`ainkrad_run` and the `ainkrad` CLI): a QuickJS script engine in the runner executable.
# Off by default; a release ships it deliberately (`--features quickjs`).
quickjs = ["dep:rquickjs"]

[dependencies]
# default-features off: no module loader, no `std`/`os` JS modules, no futures/parallel. Bundled C QuickJS.
rquickjs = { version = "0.14.0", default-features = false, optional = true }
# A file an agent publishes by path (E15.12) travels to the server base64-encoded.
base64 = "0.22.1"
# Sync hashes (E15-4): the same blake3 the Core's workspace uses.
blake3 = "1.8.7"
# Unpacking AI tool and toolchain downloads in-process: the runner unit's RestrictSUIDSGID blocks openat2, which GNU tar
# 1.35 needs (2026-11-21). Pure Rust gzip (miniz_oxide), no C library.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
ainkrad-harness = { path = "../harness" }
ainkrad-proto = { path = "../proto" }
# Terminals (E2-02, E2-03): the host process and its client.
ainkrad-ptyhost = { path = "../ptyhost" }
ainkrad-sys = { path = "../sys" }
futures-util = "0.3.34"
# The connection proof and pairing (E1-11.3): P-256 keys, SHA-256, randomness; already under
# rustls. HTTP to the Core's /handshake and /pair routes.
reqwest = { version = "0.12.28", default-features = false, features = ["http2", "json", "rustls-tls"] }
ring = "0.17.14"
# Only to pick `ring` as rustls's crypto provider for wss://; tokio-tungstenite enables none.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# Agent sessions (E2-08): their state on disk.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SSH client (Y2-01, plan T1): host-key callback, jump chains, exec. Pinned exactly; 0.65.2 has strict-kex
# (Terrapin). `ring` (already in the tree), not aws-lc. `rsa` (E0-9, D-23) is on for RSA user keys, and
# it brings `rsa` 0.10.0, the release that fixes RUSTSEC-2023-0071 (Marvin): 0.65.1 pinned the rc.18
# pre-release, 0.65.2 takes `^0.10`. Signing is rsa-sha2-256/512 only (`rsa_hash` in v2/ssh/mod.rs), no
# RSA host key is offered, no `dsa`, no zlib.
russh = { version = "=0.65.2", default-features = false, features = ["ring", "rsa"] }
# SFTP client (Y2-03, plan T5) over a russh session channel; it also ships the server side the tests use.
russh-sftp = "=3.0.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.10"
tokio = { version = "1.54.0", features = ["macros", "io-std", "io-util", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# A session's redeemed secrets (E2-07.2), wiped when dropped (best effort).
zeroize = "1.9.1"

# A local HTTPS git server with a throwaway CA, for the workspace's transport tests (KAN-271).
[dev-dependencies]
tokio = { version = "1.54.0", features = ["test-util"] }
ainkrad-gitfixture = { path = "../gitfixture" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# ssh.exec tests: fixture host keys, and the `log` records russh emits.
rand = "0.10"
log = "0.4"
